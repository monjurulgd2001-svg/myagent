name: Hermes Connection Test - VPN & Proxy

# Dispatched from the config panel ("Test VPN & proxies" button on the
# Zedge page). Browsers cannot open VPN/proxy sockets, so the REAL test
# runs here on a runner; results are published to Firebase
# runtime/<uid>/conntest and the panel renders them live.
# No baked-in endpoints: every value comes from the config panel
# (Firebase vault) or GitHub secrets.
# NOTE: avoid running this while the main agent has a VPN up - both use
# the same zedgevpnN namespaces.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hermes-conntest
  cancel-in-progress: true

env:
  TZ: Asia/Dhaka

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load configuration from Firebase vault
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          GH_ZEDGE_PROXIES: ${{ secrets.ZEDGE_PROXIES }}
          GH_ZEDGE_WG_1: ${{ secrets.ZEDGE_WG_1 }}
          GH_ZEDGE_WG_2: ${{ secrets.ZEDGE_WG_2 }}
          GH_ZEDGE_WG_3: ${{ secrets.ZEDGE_WG_3 }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/firebase_vault.py"

      - name: Write VPN / proxy files (same layout the agent uses)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.hermes/zedge-vpn"
          chmod 700 "$HOME/.hermes/zedge-vpn"
          printf '%s\n' "${ZEDGE_PROXIES:-}" > "$HOME/.hermes/zedge-proxies.txt"
          printf '%s\n' "${ZEDGE_WG_1:-}" > "$HOME/.hermes/zedge-vpn/zedge1.conf"
          printf '%s\n' "${ZEDGE_WG_2:-}" > "$HOME/.hermes/zedge-vpn/zedge2.conf"
          printf '%s\n' "${ZEDGE_WG_3:-}" > "$HOME/.hermes/zedge-vpn/zedge3.conf"
          chmod 600 "$HOME/.hermes/zedge-vpn"/* "$HOME/.hermes/zedge-proxies.txt" 2>/dev/null || true
          if [ -n "${ZEDGE_WG_1:-}${ZEDGE_WG_2:-}${ZEDGE_WG_3:-}" ]; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq wireguard-tools >/dev/null 2>&1 || true
          fi

      - name: Run VPN & proxy tests + publish live results
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
        run: python3 "$GITHUB_WORKSPACE/scripts/connection_test.py"
