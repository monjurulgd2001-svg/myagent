          .btn.primary{background:linear-gradient(135deg,var(--acc),#14b8a6);color:#032620;box-shadow:0 10px 26px rgba(45,212,191,.3)}
          .btn.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
