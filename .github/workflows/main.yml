          .lat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;flex:none;white-space:nowrap;font-family:var(--mono)}
          .lat.ok{background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
          .lat.bad{background:rgba(248,113,113,.1);color:var(--bad);border:1px solid rgba(248,113,113,.3);cursor:help}
          .lat.tst{background:rgba(251,191,36,.1);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
          .skel{height:38px;border-radius:12px;margin:6px 4px;background:linear-gradient(90deg,rgba(148,163,184,.06) 25%,rgba(148,163,184,.14) 50%,rgba(148,163,184,.06) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
          @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
          footer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(7,10,18,.88);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
          .prog{height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;transition:width .3s}
