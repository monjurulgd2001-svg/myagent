name: Hermes Agent — Telegram + Slack + NVIDIA/Mistral Pool

on:
  workflow_dispatch:

# actions:write lets the last step dispatch the NEXT run (24/7 chaining)
# using the built-in GITHUB_TOKEN - no extra secret needed.
permissions:
  contents: read
  actions: write

concurrency:
  group: hermes-agent
  cancel-in-progress: false

env:
  RUN_MINUTES: 330
  HERMES_HOME: /home/runner/.hermes
  DATA_REPO: monjurulgd2001-svg/harmesprivatestorage

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ── 1. Pull persisted data from private repo ──
      - name: Pull data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          date +%s > /tmp/job_start
          mkdir -p "$HERMES_HOME"
          git clone --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/data || true
          # ── RESTORE FROM BACKUP BRANCH TOO ──
          # 30-min backups go to the `backup` branch; the final push goes to
          # `main`. If the previous run crashed or was cancelled, `backup` is
          # NEWER than `main` — overlay it so nothing since the last final
          # push is lost.
          git clone --depth 1 -b backup "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/databk 2>/dev/null || true
          if [ -d /tmp/databk/.git ] && [ -d /tmp/data/.git ]; then
            MAIN_TS=$(git -C /tmp/data log -1 --format=%ct 2>/dev/null || echo 0)
            BK_TS=$(git -C /tmp/databk log -1 --format=%ct 2>/dev/null || echo 0)
            if [ "$BK_TS" -gt "$MAIN_TS" ]; then
              echo "backup branch is newer — overlaying it onto main restore"
              rsync -a --exclude='.git' /tmp/databk/ /tmp/data/ || true
            fi
          fi
          if [ -d /tmp/data ]; then
            rm -f /tmp/data/.env
            rsync -a --exclude='.git' /tmp/data/ "$HERMES_HOME/" || true
            find "$HERMES_HOME" -name "*.gh-chunk.000" | while read -r first; do
              base="${first%.gh-chunk.000}"
              cat "${base}".gh-chunk.* > "$base"
              rm -f "${base}".gh-chunk.*
              echo "Reassembled: $base"
            done
          fi

      # ── 1b. Preinstalled environment cache ──
      # The runner VM is WIPED after every run, so nothing can be truly
      # "pre-installed". This cache is the next best thing: a snapshot of
      # installed Hermes + all pip wheels + the Camoufox browser binary,
      # restored in seconds at the start of each run instead of being
      # re-downloaded. The first run builds it; every later run refreshes
      # it automatically (rolling key).
      - name: Restore preinstalled Hermes environment (cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.cache/pip
            ~/.cache/camoufox
          key: hermes-env-v1-${{ github.run_id }}
          restore-keys: |
            hermes-env-v1-

      # ── 2. Install Hermes Agent (skipped when restored from cache) ──
      - name: Install Hermes Agent
        run: |
          rm -rf "$HERMES_HOME/hermes-agent"
          if [ -x "$HOME/.local/bin/hermes" ]; then
            echo "Hermes restored from cache — skipping download/install"
          else
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── 3. Start SearXNG (free web search) ──
      - name: Start SearXNG
        run: |
          mkdir -p /tmp/searxng
          cat > /tmp/searxng/settings.yml <<'EOF'
          use_default_settings: true
          server:
            secret_key: "hermes-searxng-secret"
            limiter: false
          search:
            formats:
              - html
              - json
          EOF
          docker run -d --name searxng -p 8080:8080 \
            -v /tmp/searxng:/etc/searxng \
            searxng/searxng:latest
          echo "Waiting for SearXNG..."
          for i in $(seq 1 30); do
            if curl -s "http://localhost:8080/search?q=test&format=json" | grep -q results; then
              echo "SearXNG is ready"; exit 0
            fi
            sleep 2
          done
          echo "SearXNG failed to start"; exit 1

      # ── 4. Start Camoufox (stealth browser, NON-headless via virtual display) ──
      - name: Start Camoufox
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          # Shared virtual display :99 — the browser AND all the agent's GUI
          # work render here, so the LIVE VIEW (below) shows everything.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11vnc novnc websockify fluxbox xterm
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb99.log 2>&1 &
          sleep 2
          export DISPLAY=:99

          # A bare Xvfb display renders PURE BLACK when idle — looks broken in
          # the live view. Fluxbox = real desktop (background, taskbar, window
          # titlebars), and the status xterm keeps something moving on screen
          # at all times so you can SEE the machine is alive.
          fluxbox > /tmp/fluxbox.log 2>&1 &
          sleep 1
          cat > /tmp/status.sh <<'EOF'
          #!/bin/bash
          while true; do
            clear
            echo "============================================"
            echo "  HERMES AGENT — LIVE DESKTOP  (display :99)"
            echo "============================================"
            date
            echo
            echo "Running services:"
            pgrep -a -f 'hermes|camoufox|litellm|searxng|cloudflared' | cut -c1-105
            echo
            echo "Browser windows appear here when the agent works..."
            sleep 2
          done
          EOF
          chmod +x /tmp/status.sh
          xterm -geometry 130x20+30+30 -fg green -bg black -T "Hermes Agent — status" -e /tmp/status.sh &

          # VISIBLE Chrome for the agent's built-in browser tools. Hermes'
          # browser toolset speaks CDP, which only Chromium-family browsers
          # support — Camoufox is Firefox-based (Juggler protocol), so the
          # built-in tools can NOT drive it; without this they auto-launch an
          # invisible headless browser. This Chrome runs HEADED on :99, so
          # every built-in browser action shows up in the live view.
          # Camoufox (port 9222) stays available for stealth scripting.
          BROWSER_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [ -n "$BROWSER_BIN" ]; then
            mkdir -p "$HERMES_HOME/chrome-profile"
            nohup "$BROWSER_BIN" --remote-debugging-port=9223 \
              --user-data-dir="$HERMES_HOME/chrome-profile" \
              --no-first-run --no-default-browser-check --disable-gpu \
              --window-size=1600,900 about:blank > /tmp/chrome.log 2>&1 &
            echo "Visible Chrome started on :99 (CDP port 9223)"
          else
            echo "::warning::No Chromium-family browser found — built-in browser tools will be headless"
          fi
          pip install -U "camoufox[geoip]" pyvirtualdisplay
          # fetch skips the ~200MB browser download when restored from cache
          python3 -m camoufox fetch
          mkdir -p "$HERMES_HOME/browser-profile"
          nohup python3 -c "
          from camoufox.server import launch_server
          launch_server(
              headless=False,  # real headed browser on the shared :99 display
              port=9222, ws_path='hermes',
              persistent_context=True,
              user_data_dir='/home/runner/.hermes/browser-profile',
              os='windows',
          )
          " > /tmp/camoufox.log 2>&1 &
          echo "Waiting for Camoufox (headed/virtual)..."
          for i in $(seq 1 30); do
            if grep -q 'ws://' /tmp/camoufox.log 2>/dev/null; then
              echo 'Camoufox ready (non-headless, virtual display)'; break
            fi
            sleep 3
          done
          cat /tmp/camoufox.log || true

          # ── LIVE DESKTOP VIEW: watch the agent work, from your browser ──
          # x11vnc mirrors display :99, noVNC serves a browser-based viewer on
          # port 6080 (tunnel + link are added in the Notify start step).
          # View-only + password so nobody can hijack the desktop. NOTE: VNC
          # passwords only use the FIRST 8 characters of PANEL_TOKEN.
          x11vnc -display :99 -forever -shared -viewonly -bg -quiet \
            -passwd "${PANEL_TOKEN:-hermes99}" -o /tmp/x11vnc.log
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          echo "Live desktop view server running on :6080"

      # ── 5. Write model pool control panel ──
      - name: Write control panel
        run: |
          pip install -q flask
          mkdir -p /tmp/panel
          cat > /tmp/panel/app.py <<'PYEOF'
          import os, json, subprocess, sys, time, hmac, secrets, urllib.request, urllib.error, urllib.parse

          def tg_notify(text):
              # best-effort Telegram alert; never crash the panel over it
              try:
                  tk = os.environ.get("TELEGRAM_BOT_TOKEN", "")
                  uid = os.environ.get("TELEGRAM_USER_ID", "")
                  if tk and uid:
                      urllib.request.urlopen(
                          "https://api.telegram.org/bot" + tk + "/sendMessage",
                          data=urllib.parse.urlencode({"chat_id": uid, "text": text}).encode(),
                          timeout=10)
              except Exception:
                  pass
          from flask import Flask, request, jsonify, make_response

          app = Flask(__name__)
          TOKEN = os.environ.get("PANEL_TOKEN", "")
          if len(TOKEN) < 8:
              print("FATAL: PANEL_TOKEN missing or too short (min 8 chars)")
              sys.exit(1)
          SESSION = secrets.token_hex(32)          # random per-run session cookie
          FAILS = {"n": 0, "until": 0.0}           # brute-force lockout state
          HERMES_HOME = os.environ.get("HERMES_HOME", "/home/runner/.hermes")
          POOL = os.path.join(HERMES_HOME, "pool.json")
          CFG = "/tmp/litellm.yaml"
          KEY_NAMES = sorted(k for k in os.environ if k.startswith("NVIDIA_KEY_") and os.environ[k])
          MISTRAL_KEY_NAMES = sorted(k for k in os.environ if k.startswith("MISTRAL_KEY_") and os.environ[k])
          MISTRAL_MODELS = ["mistral-large-latest", "mistral-medium-latest",
                            "mistral-small-latest", "codestral-latest"]
          BASE = "https://integrate.api.nvidia.com/v1"

          def authed():
              return hmac.compare_digest(request.cookies.get("s") or "", SESSION)

          def deny():
              return "Not Found", 404

          def fetch_models(base, key):
              r = urllib.request.Request(base + "/models",
                  headers={"Authorization": "Bearer " + os.environ[key]})
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return sorted(set(m["id"] for m in json.load(resp)["data"]))

          def load_pool():
              try:
                  return [x for x in json.load(open(POOL)) if x.get("provider") in ("nvidia", "mistral")]
              except Exception:
                  return []

          def save_pool(pool):
              os.makedirs(HERMES_HOME, exist_ok=True)
              json.dump(pool, open(POOL, "w"), indent=1)

          def probe(provider, mid):
              # Fire a REAL 1-token completion. Catalog presence does NOT mean
              # the model is callable on your plan (free tier can SEE premier/
              # labs models in /models but gets 4xx when calling them).
              # Returns False only on a definitive 4xx = "not usable on this
              # plan/key". 429 (busy) and 5xx/network issues fail open.
              base = BASE if provider == "nvidia" else "https://api.mistral.ai/v1"
              keys = KEY_NAMES if provider == "nvidia" else MISTRAL_KEY_NAMES
              if not keys:
                  return False
              body = json.dumps({"model": mid, "max_tokens": 1,
                                 "messages": [{"role": "user", "content": "hi"}]}).encode()
              req = urllib.request.Request(base + "/chat/completions", data=body,
                  headers={"Authorization": "Bearer " + os.environ[keys[0]],
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      r.read()
                  return True
              except urllib.error.HTTPError as e:
                  return e.code == 429 or e.code >= 500
              except Exception:
                  return True

          def prune_pool(pool):
              # Two-stage check so bad models can never poison pool-auto:
              #  1. LIVE catalog — drops retired/EOL models (HTTP 410).
              #  2. probe() — drops models your PLAN cannot actually call.
              # Fail-open: if a catalog fetch fails, stage 1 keeps entries.
              live = {}
              try:
                  if KEY_NAMES:
                      live["nvidia"] = set(fetch_models(BASE, KEY_NAMES[0]))
              except Exception:
                  pass
              try:
                  if MISTRAL_KEY_NAMES:
                      live["mistral"] = set(fetch_models("https://api.mistral.ai/v1", MISTRAL_KEY_NAMES[0]))
              except Exception:
                  pass
              kept, removed = [], []
              for it in pool:
                  # a provider with ZERO working keys has zero deployments:
                  # its pool entries are useless, drop them
                  keys_for = KEY_NAMES if it["provider"] == "nvidia" else MISTRAL_KEY_NAMES
                  if not keys_for:
                      removed.append(it["id"])
                      continue
                  cat = live.get(it["provider"])
                  if cat is not None and it["id"] not in cat:
                      removed.append(it["id"])
                      continue
                  if probe(it["provider"], it["id"]):
                      kept.append(it)
                  else:
                      removed.append(it["id"])
                  time.sleep(1.1)  # respect the 1 req/sec free-tier limit
              return kept, removed

          def auto_prune_loop():
              # every 30 min: drop models retired MID-RUN and hot-reload router
              while True:
                  time.sleep(1800)
                  try:
                      kept, removed = prune_pool(load_pool())
                      if removed and kept:
                          save_pool(kept)
                          write_config(kept)
                          subprocess.Popen(["docker", "restart", "-t", "2", "litellm"],
                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          print("auto-pruned dead/EOL models: " + ", ".join(removed), flush=True)
                          tg_notify("🪦 Hermes: auto-pruned dead model(s) mid-run: " + ", ".join(removed) + ". Pool keeps running with the rest.")
                  except Exception as e:
                      print("auto-prune error: " + str(e), flush=True)

          def write_config(pool):
              L = ["model_list:"]
              def dep(alias, provider, mid):
                  keys = KEY_NAMES if provider == "nvidia" else MISTRAL_KEY_NAMES
                  prefix = "nvidia_nim/" if provider == "nvidia" else "mistral/"
                  rpm = "40" if provider == "nvidia" else "30"
                  for k in keys:
                      L.append('  - model_name: "%s"' % alias)
                      L.append("    litellm_params:")
                      L.append('      model: "%s%s"' % (prefix, mid))
                      L.append("      api_key: os.environ/" + k)
                      L.append("      rpm: " + rpm)
                      # tokens-per-minute budget: with pre-call checks on, the
                      # router SKIPS keys whose TPM quota is spent this minute
                      # instead of firing a request that will 429
                      L.append("      tpm: " + ("400000" if provider == "nvidia" else "500000"))
              for it in pool:
                  # each selected model is callable by its own name...
                  dep(it["id"], it["provider"], it["id"])
                  # ...AND is a deployment of the auto-rotating "pool-auto" group:
                  # every request to pool-auto round-robins across ALL selected
                  # models x ALL keys automatically (no manual switching)
                  dep("pool-auto", it["provider"], it["id"])
              L += ["router_settings:",
                    "  routing_strategy: simple-shuffle",
                    "  num_retries: 5",
                    "  retry_after: 5",
                    "  allowed_fails: 1",
                    "  cooldown_time: 30",
                    "  enable_pre_call_checks: true",
                    "  timeout: 90",
                    # NVIDIA NIM sometimes returns HTTP 400 for INFRA problems
                    # ("DEGRADED function cannot be invoked") which is really a
                    # deployment-specific outage, not a bad request. Retry
                    # BadRequestError too so rotation moves to a healthy
                    # model/key instead of instantly failing the user's turn.
                    "  retry_policy:",
                    "    BadRequestErrorRetries: 4",
                    "    TimeoutErrorRetries: 5",
                    "    RateLimitErrorRetries: 5",
                    "    InternalServerErrorRetries: 5",
                    "    ContentPolicyViolationErrorRetries: 2"]
              # NO fallbacks: the router NEVER silently swaps to a different
              # model. Rate limits are handled by rotating API keys of the
              # SAME model: 1 fail -> that key cools 30s -> next key, 5 retries.
              L += ["litellm_settings:",
                    "  drop_params: true",
                    "  request_timeout: 90"]
              # LiteLLM's per-worker parallel-request counter LEAKS: it counts
              # requests in but never back out (github.com/BerriAI/litellm
              # issues #27900 / #20256), so any small limit is eventually hit
              # (39 -> 272 -> 472 out of 32). Raise the ceiling so high that a
              # 5.5h run can never reach it; the watchdog restart is the
              # backstop if it somehow does.
              L += ["general_settings:",
                    "  global_max_parallel_requests: 100000"]
              open(CFG, "w").write("\n".join(L) + "\n")

          LOGIN = """<!doctype html><html><head><meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>Hermes Panel</title>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
          <style>
          :root{--bg:#070a12;--card:rgba(20,26,40,.72);--line:rgba(148,163,184,.14);--txt:#e8eef7;--dim:#8b98ad;--acc:#2dd4bf;--acc2:#8b5cf6}
          *{box-sizing:border-box;margin:0}
          body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
          .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
          .o1{width:480px;height:480px;background:radial-gradient(circle,#0d9488,transparent 70%);top:-140px;left:-120px}
          .o2{width:520px;height:520px;background:radial-gradient(circle,#6d28d9,transparent 70%);bottom:-180px;right:-140px;animation-delay:-8s}
          @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,36px) scale(1.12)}}
          .box{position:relative;background:var(--card);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;padding:44px 40px;width:370px;text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.55);animation:up .5s cubic-bezier(.2,.9,.3,1.2)}
          @keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
          .logo{width:60px;height:60px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 12px 34px rgba(45,212,191,.35)}
          h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
          .tag{color:var(--dim);font-size:12.5px;margin:6px 0 26px}
          .field{position:relative;margin-bottom:16px}
          input{width:100%;background:rgba(8,12,22,.85);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:14px 46px 14px 15px;font-size:15px;outline:none;transition:.2s;font-family:inherit}
          input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(45,212,191,.14)}
          .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--dim);font-size:16px;user-select:none}
          button{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;background:linear-gradient(135deg,var(--acc),#14b8a6);color:#032620;cursor:pointer;transition:.2s;box-shadow:0 10px 26px rgba(45,212,191,.28)}
          button:hover{transform:translateY(-1px);filter:brightness(1.08)}
          button:disabled{opacity:.55;cursor:wait;transform:none}
          #err{color:#f87171;font-size:13px;min-height:18px;margin-top:14px}
          .shake{animation:shake .4s}
          @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
          .foot{margin-top:22px;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
          </style></head><body>
          <div class="orb o1"></div><div class="orb o2"></div>
          <div class=box id=box>
            <div class=logo>&#9884;</div>
            <h1>Hermes Command Deck</h1>
            <div class=tag>Model pool &amp; router control</div>
            <form onsubmit="go(event)">
              <div class=field>
                <input type=password id=pw placeholder="Panel password" autofocus autocomplete=off>
                <span class=eye onclick="tgl()" id=eye>&#128065;</span>
              </div>
              <button id=btn>Unlock console</button>
            </form>
            <div id=err></div>
            <div class=foot>secured &middot; session-scoped &middot; rate-limited</div>
          </div>
          <script>
          function tgl(){const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'}
          async function go(e){e.preventDefault();
            const b=document.getElementById('btn');b.disabled=true;b.textContent='Verifying...';
            const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({password:document.getElementById('pw').value})})
              .then(x=>x.json()).catch(()=>({ok:false,msg:'network error'}));
            if(r.ok)location.reload();
            else{b.disabled=false;b.textContent='Unlock console';
              document.getElementById('err').textContent=r.msg;
              const bx=document.getElementById('box');bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake');}
          }
          </script></body></html>"""

          HTML = """<!doctype html><html><head><meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>Hermes Command Deck</title>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
          <style>
          :root{--bg:#070a12;--card:rgba(19,25,39,.66);--line:rgba(148,163,184,.13);--txt:#e8eef7;--dim:#8b98ad;--acc:#2dd4bf;--acc2:#8b5cf6;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--mono:'JetBrains Mono',ui-monospace,monospace}
          *{box-sizing:border-box;margin:0}
          body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:104px}
          .orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.4;pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite alternate}
          .o1{width:560px;height:560px;background:radial-gradient(circle,#0d9488,transparent 70%);top:-200px;left:-160px}
          .o2{width:600px;height:600px;background:radial-gradient(circle,#6d28d9,transparent 70%);bottom:-240px;right:-180px;animation-delay:-9s}
          @keyframes drift{from{transform:translate(0,0)}to{transform:translate(46px,30px)}}
          nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(7,10,18,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
          .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 8px 22px rgba(45,212,191,.3)}
          nav h1{font-size:16px;font-weight:800;letter-spacing:-.02em}
          nav .crumb{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
          .pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.25);color:var(--ok);font-size:12px;font-weight:600;padding:6px 14px;border-radius:99px;max-width:46vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
          .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
          @keyframes pulse{50%{opacity:.35}}
          .wrap{position:relative;z-index:1;padding:22px 26px;max-width:860px;margin:0 auto}
