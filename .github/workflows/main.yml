          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
          <style>
          :root{--bg:#070a12;--card:rgba(20,26,40,.72);--line:rgba(148,163,184,.14);--txt:#e8eef7;--dim:#8b98ad;--acc:#2dd4bf;--acc2:#8b5cf6}
          *{box-sizing:border-box;margin:0}
          body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
          .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
          .o1{width:480px;height:480px;background:radial-gradient(circle,#0d9488,transparent 70%);top:-140px;left:-120px}
          .o2{width:520px;height:520px;background:radial-gradient(circle,#6d28d9,transparent 70%);bottom:-180px;right:-140px;animation-delay:-8s}
          @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,36px) scale(1.12)}}
          .box{position:relative;background:var(--card);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;padding:44px 40px;width:370px;text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.55);animation:up .5s cubic-bezier(.2,.9,.3,1.2)}
          @keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
          .logo{width:60px;height:60px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 12px 34px rgba(45,212,191,.35)}
          h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
          .tag{color:var(--dim);font-size:12.5px;margin:6px 0 26px}
          .field{position:relative;margin-bottom:16px}
          input{width:100%;background:rgba(8,12,22,.85);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:14px 46px 14px 15px;font-size:15px;outline:none;transition:.2s;font-family:inherit}
          input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(45,212,191,.14)}
          .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--dim);font-size:16px;user-select:none}
          button{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;background:linear-gradient(135deg,var(--acc),#14b8a6);color:#032620;cursor:pointer;transition:.2s;box-shadow:0 10px 26px rgba(45,212,191,.28)}
          button:hover{transform:translateY(-1px);filter:brightness(1.08)}
          button:disabled{opacity:.55;cursor:wait;transform:none}
          #err{color:#f87171;font-size:13px;min-height:18px;margin-top:14px}
          .shake{animation:shake .4s}
          @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
          .foot{margin-top:22px;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
          </style></head><body>
          <div class="orb o1"></div><div class="orb o2"></div>
          <div class=box id=box>
            <div class=logo>&#9884;</div>
            <h1>Hermes Command Deck</h1>
            <div class=tag>Model pool &amp; router control</div>
            <form onsubmit="go(event)">
              <div class=field>
                <input type=password id=pw placeholder="Panel password" autofocus autocomplete=off>
                <span class=eye onclick="tgl()" id=eye>&#128065;</span>
              </div>
              <button id=btn>Unlock console</button>
            </form>
            <div id=err></div>
            <div class=foot>secured &middot; session-scoped &middot; rate-limited</div>
          </div>
          <script>
          function tgl(){const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'}
          async function go(e){e.preventDefault();
            const b=document.getElementById('btn');b.disabled=true;b.textContent='Verifying...';
            const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({password:document.getElementById('pw').value})})
              .then(x=>x.json()).catch(()=>({ok:false,msg:'network error'}));
            if(r.ok)location.reload();
            else{b.disabled=false;b.textContent='Unlock console';
              document.getElementById('err').textContent=r.msg;
              const bx=document.getElementById('box');bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake');}
          }
          </script></body></html>"""

          HTML = """<!doctype html><html><head><meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>Hermes Command Deck</title>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
          <style>
          :root{--bg:#070a12;--card:rgba(19,25,39,.66);--line:rgba(148,163,184,.13);--txt:#e8eef7;--dim:#8b98ad;--acc:#2dd4bf;--acc2:#8b5cf6;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--mono:'JetBrains Mono',ui-monospace,monospace}
          *{box-sizing:border-box;margin:0}
          body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:104px}
          .orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.4;pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite alternate}
          .o1{width:560px;height:560px;background:radial-gradient(circle,#0d9488,transparent 70%);top:-200px;left:-160px}
          .o2{width:600px;height:600px;background:radial-gradient(circle,#6d28d9,transparent 70%);bottom:-240px;right:-180px;animation-delay:-9s}
          @keyframes drift{from{transform:translate(0,0)}to{transform:translate(46px,30px)}}
          nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(7,10,18,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
          .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 8px 22px rgba(45,212,191,.3)}
          nav h1{font-size:16px;font-weight:800;letter-spacing:-.02em}
          nav .crumb{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
          .pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.25);color:var(--ok);font-size:12px;font-weight:600;padding:6px 14px;border-radius:99px;max-width:46vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
          .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
          @keyframes pulse{50%{opacity:.35}}
          .wrap{position:relative;z-index:1;padding:22px 26px;max-width:860px;margin:0 auto}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
          .stat{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;transition:.25s}
