                      "and nothing else: [[AGENT]]")

          def fast_answer(text, hist):
              # One quick call to the local pool router. Returns a direct reply,
              # or None when the message should go to the full agent.
              msgs = [{"role": "system", "content": FAST_SYS}]
              for m in hist[-6:]:
                  if (isinstance(m, dict) and m.get("role") in ("user", "assistant")
                          and isinstance(m.get("content"), str)):
                      msgs.append({"role": m["role"], "content": m["content"][:1200]})
              msgs.append({"role": "user", "content": text[:4000]})
              try:
                  r = rq.post(ROUTER,
                              headers={"Authorization": "Bearer sk-local",
                                       "Content-Type": "application/json"},
                              json={"model": "pool-auto", "messages": msgs,
                                    "max_tokens": 500, "temperature": 0.6},
                              timeout=15)
                  if r.status_code == 200:
                      out = (r.json()["choices"][0]["message"]["content"] or "").strip()
                      if out and "[[AGENT]]" not in out:
                          return out
              except Exception:
                  pass
              return None

          def run_dispatch(jid, text, hist, deep):
              # Try the fast lane first (unless files are attached / forced deep);
              # fall back to the full agent when the router says [[AGENT]].
              if not deep:
                  fast = fast_answer(text, hist)
                  if JOBS.get(jid, {}).get("done"):
                      return  # interrupted while the fast lane was running
                  if fast is not None:
                      JOBS[jid] = {"done": True, "reply": fast[-6000:]}
                      return
              run_job(jid, text)

          def run_job(jid, text):
              env = dict(os.environ, NO_COLOR="1", TERM="dumb", DISPLAY=":99")
              try:
                  p = subprocess.Popen(
                      ["hermes", "chat", "-q", text, "--source", "tool"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      text=True, start_new_session=True, env=env)
                  PROCS[jid] = p
                  try:
                      out, err = p.communicate(timeout=1800)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(os.getpgid(p.pid), signal.SIGKILL)
                      except Exception:
                          p.kill()
                      JOBS[jid] = {"done": True, "reply": "Task timed out after 30 minutes, Boss."}
                      return
                  if JOBS.get(jid, {}).get("done"):
                      return  # already marked interrupted via /stop
                  outc = ANSI.sub("", (out or "")).strip()
                  if not outc:
                      outc = ANSI.sub("", (err or "")).strip() or "(no output)"
                  JOBS[jid] = {"done": True, "reply": extract_reply(outc)[-6000:]}
              except Exception as e:
                  JOBS[jid] = {"done": True, "reply": "Error: %s" % e}
              finally:
                  PROCS.pop(jid, None)

          @app.route("/")
          def home():
              return Response(HTML, mimetype="text/html")

          @app.route("/config")
          def config():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              return jsonify(tts=EDGE, stt=bool(GROQ) or bool(el_keys()),
                             voices=VOICES, defaults=DEFAULT_VOICES)

          @app.route("/tts", methods=["POST"])
          def tts_route():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              data = request.get_json(silent=True) or {}
              text = (data.get("text") or "").strip()
              if not text:
                  return jsonify(error="empty"), 400
              audio = edge_speak(text, (data.get("voice") or "").strip())
              if audio:
                  return Response(audio, mimetype="audio/mpeg")
              return jsonify(error="tts unavailable"), 503

          @app.route("/stt", methods=["POST"])
          def stt_route():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              blob = request.get_data()
              if not blob or len(blob) < 1000:
                  return jsonify(error="no audio received"), 400
              text = do_stt(blob, request.headers.get("Content-Type", "audio/webm"),
                            request.args.get("lang", "en-US"))
              if text:
                  return jsonify(text=text)
              return jsonify(error="transcription unavailable (add GROQ_API_KEY or ELEVENLABS_KEYS)"), 503

          @app.route("/upload", methods=["POST"])
          def upload():
              # Files land in ~/.hermes/work/uploads/ - inside the persisted+backed-up
              # ~/.hermes tree, so uploads survive the run and the agent can read them.
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              f = request.files.get("file")
              if not f or not f.filename:
                  return jsonify(error="no file received"), 400
              os.makedirs(UPLOAD_DIR, exist_ok=True)
              name = secure_filename(f.filename) or ("file_%d" % int(time.time()))
              path = os.path.join(UPLOAD_DIR, time.strftime("%Y%m%d_%H%M%S_") + name)
              f.save(path)
              return jsonify(path=path, name=name, size=os.path.getsize(path))

          @app.route("/ask", methods=["POST"])
          def ask():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              data = request.get_json(silent=True) or {}
              text = (data.get("text") or "").strip()
              fpaths = data.get("files") or []
              safe = []
              root = os.path.realpath(UPLOAD_DIR)
              for pth in fpaths:
                  if isinstance(pth, str):
                      rp = os.path.realpath(pth)
                      if rp.startswith(root + os.sep) and os.path.isfile(rp):
                          safe.append(rp)
              if not text and not safe:
                  return jsonify(error="empty command"), 400
              if safe:
                  text = ("The user uploaded file(s) for you, already saved on this machine at: "
                          + ", ".join(safe)
                          + " - use your terminal/files tools to read them. "
                          + (text or "Inspect the file(s) and report what they contain, Boss."))
              hist = data.get("history") or []
              if not isinstance(hist, list):
                  hist = []
              jid = uuid.uuid4().hex
              JOBS[jid] = {"done": False}
              threading.Thread(target=run_dispatch, args=(jid, text, hist[-8:], bool(safe)),
                               daemon=True).start()
              return jsonify(job=jid)

          @app.route("/stop", methods=["POST"])
          def stop_route():
              # Interrupt a running task: kill the hermes chat process group.
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              jid = request.args.get("id", "")
              if jid not in JOBS:
                  return jsonify(ok=False, error="unknown job")
              JOBS[jid] = {"done": True, "reply": "Task interrupted by you, Boss. Standing by."}
              p = PROCS.get(jid)
              if not p:
                  return jsonify(ok=True)
              try:
                  os.killpg(os.getpgid(p.pid), signal.SIGTERM)
              except Exception:
                  try:
                      p.terminate()
                  except Exception:
                      pass
              return jsonify(ok=True)

          @app.route("/poll")
          def poll():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              j = JOBS.get(request.args.get("id", ""))
              if not j:
                  return jsonify(error="unknown job"), 404
              return jsonify(**j)

          app.run(host="0.0.0.0", port=7777, threaded=True)
          PYJARVIS
          pip install -q flask requests edge-tts || true
          nohup python3 /tmp/jarvis/app.py > /tmp/jarvis.log 2>&1 &
          sleep 2
          curl -fs http://localhost:7777/ >/dev/null || { echo '::warning::Agent HUD failed to start'; cat /tmp/jarvis.log; }
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:7777 > /tmp/jarvis-tunnel.log 2>&1 &
          JARVIS_URL=""
          for i in $(seq 1 30); do
            JARVIS_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/jarvis-tunnel.log | head -n1 || true)
            [ -n "$JARVIS_URL" ] && break
            sleep 2
          done
          echo "JARVIS_URL=$JARVIS_URL" >> "$GITHUB_ENV"
          echo "::notice title=🤖 Agent HUD::${JARVIS_URL:-tunnel failed}"





      # ── 11. Background backup loop (every 30 min -> backup branch) ──
      - name: Start backup loop
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cat > /tmp/sync.sh <<'EOF'
          #!/bin/bash
          while true; do
            sleep 1800
            rm -rf /tmp/backup && mkdir -p /tmp/backup
            rsync -a --exclude='.env' --exclude='.git' --exclude='*.log' --exclude='hermes-agent' \
              --exclude='browser-profile/cache2' --exclude='browser-profile/startupCache' \
              --exclude='browser-profile/shader-cache' \
              "$HERMES_HOME/" /tmp/backup/
            cd /tmp/backup
            find . -type f -size +90M | while read -r f; do
              split -b 90M -d -a 3 "$f" "$f.gh-chunk."
              rm -f "$f"
            done
            git init -q -b backup
            git config user.email "bot@hermes" && git config user.name "hermes-bot"
            git add -A && git commit -q -m "backup $(date -u +%FT%TZ)" || true
            git push -f "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" backup 2>/dev/null || true
            echo "Backup pushed at $(date)"
          done
          EOF
          chmod +x /tmp/sync.sh
          HERMES_HOME="$HERMES_HOME" DATA_REPO="$DATA_REPO" DATA_REPO_TOKEN="$DATA_REPO_TOKEN" \
            nohup /tmp/sync.sh > /tmp/sync.log 2>&1 &

      # ── 12. Notify start on Telegram (includes panel links) ──
      - name: Notify start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          # third quick tunnel: LIVE DESKTOP VIEW (noVNC on :6080, see step 4)
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:6080 > /tmp/liveview-tunnel.log 2>&1 &
          LIVEVIEW_URL=""
          for i in $(seq 1 30); do
            LIVEVIEW_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/liveview-tunnel.log | head -n1 || true)
            [ -n "$LIVEVIEW_URL" ] && break
            sleep 2
          done
          [ -n "$LIVEVIEW_URL" ] && LIVEVIEW_URL="${LIVEVIEW_URL}/vnc.html"
          echo "::notice title=🔭 Live desktop view::${LIVEVIEW_URL:-tunnel failed}"
          TG_API="https://api.telegram.org"
          curl -s -X POST "${TG_API}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d text="🟢 Hermes Agent ONLINE (Telegram + Slack, NVIDIA/Mistral pool)
          🎛️ Model panel: ${PANEL_URL}
          🖥️ Hermes WebUI: ${WEBUI_URL:-not available}
          🔭 Live desktop: ${LIVEVIEW_URL:-not available} (pass: first 8 chars of PANEL_TOKEN)
          🤖 Agent HUD: ${JARVIS_URL:-not available} (token: your PANEL_TOKEN)
          🔑 Password: your PANEL_TOKEN secret
          Use /model in Telegram or !model in Slack to switch models" > /dev/null

      # ── 13. Run gateway with time budget + anti-stuck watchdog ──
      - name: Run Hermes gateway
        run: |
          # Shared virtual display :99 (browser + agent GUI + live view all
          # render here; normally started in step 4 — this is just a safety
          # net). Every terminal the agent opens inherits DISPLAY=:99.
          if ! pgrep -f "Xvfb :99" >/dev/null; then
            Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb99.log 2>&1 &
            sleep 2
          fi
          export DISPLAY=:99

          # ── SMART SESSION RESET ──
          # Only start a fresh chat session when the saved context is actually
          # huge. Blindly resetting every run loses the conversation the user
          # was in the middle of — that caused real data loss before.
          python3 - <<'PYSESS'
          import json, os, re, sqlite3
          home = os.path.expanduser("~/.hermes")
          sf = os.path.join(home, "sessions", "sessions.json")
          db = os.path.join(home, "state.db")
          try:
              raw = open(sf).read()
              ids = set(re.findall(r"\d{8}_\d{6}_[0-9a-f]+", raw))
              worst = 0
              if ids and os.path.exists(db):
                  con = sqlite3.connect(db)
                  for sid in ids:
                      n = con.execute(
                          "SELECT COALESCE(SUM(token_count),0) FROM messages WHERE session_id=?",
                          (sid,),
                      ).fetchone()[0]
                      worst = max(worst, n or 0)
                  con.close()
              if worst > 45000:
                  os.remove(sf)
                  print("session context too big (%d tokens) - fresh session" % worst)
              else:
                  print("keeping sessions (max %d tokens)" % worst)
          except Exception as e:
              print("session check skipped:", e)
          PYSESS

          # watchdog: if the LiteLLM router hangs (rate-limit deadlock etc.),
          # auto-restart it — no more force-stopping the whole Action run
          cat > /tmp/watchdog.sh <<'EOF'
          #!/bin/bash
          fails=0
          while true; do
            sleep 60
            # ZOMBIE detection: LiteLLM's per-worker request counter can LEAK
            # (climbs 39 -> 80 -> 272 and never resets). The catalog endpoint
            # still answers, so a plain health check passes while every real
            # completion gets 500 "Worker local total request limit reached".
            # Restart immediately when that error shows up in recent logs.
            if docker logs litellm --since 90s 2>&1 | grep -q "Worker local total request limit reached"; then
              echo "$(date) Router counter leak detected — restarting litellm container"
              # -t 2: kill fast. Default docker restart waits 10s for graceful
              # stop; that downtime is what burns the gateway's quick retries.
              docker restart -t 2 litellm >/dev/null 2>&1 || true
              fails=0
              continue
            fi
            if curl -fs -m 15 http://localhost:4000/v1/models >/dev/null 2>&1; then
              fails=0
            else
              fails=$((fails+1))
              echo "$(date) LiteLLM health check failed ($fails/3)"
              if [ "$fails" -ge 3 ]; then
                echo "$(date) Router stuck — restarting litellm container"
                docker restart -t 2 litellm >/dev/null 2>&1 || true
                fails=0
              fi
            fi
          done
          EOF
          chmod +x /tmp/watchdog.sh
          nohup /tmp/watchdog.sh > /tmp/watchdog.log 2>&1 &

          JOB_START=$(cat /tmp/job_start)
          END=$(( JOB_START + RUN_MINUTES * 60 ))
          while true; do
            NOW=$(date +%s)
            REMAIN=$(( (END - NOW) / 60 ))
            if [ "$REMAIN" -le 2 ]; then
              echo "Time budget exhausted"; break
            fi
            # keep "pool-auto" as default on every gateway (re)start — it
            # always reflects the CURRENT pool you applied from the panel
            hermes config set model.default "pool-auto" || true
            echo "Starting gateway (${REMAIN}m remaining)..."
            timeout -k 60 "${REMAIN}m" hermes gateway || true
            # 60s (not 10s): Telegram holds the previous gateway's getUpdates
            # session open for up to ~1 min after a crash. Restarting too fast
            # causes "Conflict: terminated by other getUpdates request" and a
            # fatal polling-conflict loop.
            echo "Gateway exited, restarting in 60s..."
            sleep 60
          done

      # ── 14. Final push to data repo (main) ──
      - name: Final data push
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          rm -rf /tmp/final && mkdir -p /tmp/final
          rsync -a --exclude='.env' --exclude='.git' --exclude='*.log' --exclude='hermes-agent' \
            --exclude='browser-profile/cache2' --exclude='browser-profile/startupCache' \
            --exclude='browser-profile/shader-cache' \
            "$HERMES_HOME/" /tmp/final/ || true
          cd /tmp/final
          find . -type f -size +90M | while read -r f; do
            split -b 90M -d -a 3 "$f" "$f.gh-chunk."
            rm -f "$f"
          done
          cat > .gitignore <<'EOF'
          .env
          *.log
          EOF
          git init -q -b main
          git config user.email "bot@hermes" && git config user.name "hermes-bot"
          git add -A && git commit -q -m "final save $(date -u +%FT%TZ)" || true
          git push -f "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" main

      # ── 15. Start next run (24/7 chaining) ──
      # Dispatches a fresh run of THIS workflow when the current one ends.
      # The concurrency group makes the new run QUEUE until this one exits,
      # so two gateways never overlap (no Telegram polling conflict).
      # Cancelling a run manually BREAKS the chain (if: !cancelled()) -
      # cancel = stop for good, let it finish = runs 24/7.
      - name: Start next run (24/7 chain)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF_FILE="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          WF_FILE="${WF_FILE%%@*}"
          echo "Chaining next run of ${WF_FILE} on ${GITHUB_REF_NAME}..."
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" \
            && echo "Next run queued OK" || echo "::warning::Could not queue next run"

      # ── 16. Notify failure ──
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          TG_API="https://api.telegram.org"
          curl -s -X POST "${TG_API}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d text="🔴 Hermes Agent run FAILED — check Actions logs" > /dev/null
