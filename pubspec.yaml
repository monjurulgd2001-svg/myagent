name: gemini_hd_studio
description: "Zedge Studio — Wallpaper Set Designer, AI Metadata & Panel Uploader (Android + Windows). Flutter port of the Gemini HD Studio v2.5.3 Chrome extension."
publish_to: 'none'
version: 2.5.79+144

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # No WebView plugin: sign-in + browsing use the built-in Firefox
  # engine (Android, GeckoView) and the app's own Chrome/Edge
  # window (Windows). flutter_inappwebview was removed in v17 —
  # it was unused in lib/ and its old Android module risked
  # breaking the AGP 8.9 / Kotlin 2.3 toolchain.
  http: ^1.2.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  # v141 — finished animations play inside the device-frame
  # preview (video_player; Android/iOS/macOS/web only — on
  # Windows the preview falls back to the in-app browser).
  video_player: ^2.9.1
  file_picker: ^8.1.2
  image: ^4.2.0
  archive: ^3.6.1
  crypto: ^3.0.3
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # v141 — the video-player test fake imports the platform
  # interface directly (test-only dependency).
  video_player_platform_interface: ^6.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Inter UI font (from generate-main design system): crisp, consistent
  # typography across Android and Windows.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
